{% extends "base.html" %}
{% block content %}
<div class="page-head"><div><p class="eyebrow">ADMIN</p><h1>จัดการผู้ใช้งาน</h1></div></div>
<div class="row g-4"><div class="col-12 col-lg-5"><section class="detail-card"><h2 class="h5 mb-3">เพิ่มผู้ใช้</h2><form method="post" action="/admin/users" class="vstack gap-3"><input type="hidden" name="csrf" value="{{ csrf_token }}"><div><label class="form-label">ชื่อผู้ใช้</label><input class="form-control" name="username" minlength="3" required></div><div><label class="form-label">รหัสผ่าน</label><input class="form-control" name="password" type="password" minlength="8" required></div><div><label class="form-label">สิทธิ์</label><select class="form-select" name="role"><option value="user">User</option><option value="admin">Admin</option></select></div><button class="btn btn-primary">เพิ่มผู้ใช้</button></form></section></div>
<div class="col-12 col-lg-7"><section class="result-card"><div class="result-head"><h2 class="h5 mb-0">ผู้ใช้ทั้งหมด</h2></div><table class="table mb-0"><thead><tr><th>ชื่อผู้ใช้</th><th>สิทธิ์</th><th>สถานะ</th><th></th></tr></thead><tbody>{% for item in users %}<tr><td>{{ item.username }}</td><td>{{ item.role }}</td><td>{{ 'ใช้งาน' if item.is_active else 'ปิดใช้งาน' }}</td><td class="text-end">{% if item.id != user.id %}<form method="post" action="/admin/users/{{ item.id }}/toggle"><input type="hidden" name="csrf" value="{{ csrf_token }}"><button class="btn btn-sm btn-outline-secondary">{{ 'ปิดใช้งาน' if item.is_active else 'เปิดใช้งาน' }}</button></form>{% endif %}</td></tr>{% endfor %}</tbody></table></section></div></div>
{% endblock %}
